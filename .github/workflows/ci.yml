name: Flutter CI

on:
  pull_request:
  push:
    branches: [main, fix/tax-mode-consistency]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply asserted source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:80]!r}')
              p.write_text(s.replace(old, new, count))

          # e-Way Bills: State.context is used after dialogs return.
          p='lib/features/eway/eway_bills_screen.dart'
          patch(p, "      ]) {\n        c.dispose();\n      }\n      if (ok == true) {", "      ]) {\n        c.dispose();\n      }\n      if (!mounted) return;\n      if (ok == true) {")
          patch(p, "    for (final c in [vehicle, fromPlace, fromState, remarks]) {\n      c.dispose();\n    }\n    if (ok == true) {", "    for (final c in [vehicle, fromPlace, fromState, remarks]) {\n      c.dispose();\n    }\n    if (!mounted) return;\n    if (ok == true) {")
          patch(p, "    for (final c in [vehicle, fromPlace, fromState]) {\n      c.dispose();\n    }\n    if (ok == true) {", "    for (final c in [vehicle, fromPlace, fromState]) {\n      c.dispose();\n    }\n    if (!mounted) return;\n    if (ok == true) {")

          # Financial years: dialog results cross an async gap before State.context use.
          p='lib/features/financial_years/financial_years_screen.dart'
          patch(p, "    name.dispose();\n    if (ok == true) {", "    name.dispose();\n    if (!mounted) return;\n    if (ok == true) {")
          patch(p, "    reason.dispose();\n    if (ok == true) {", "    reason.dispose();\n    if (!mounted) return;\n    if (ok == true) {")

          # Inventory: guard State.context after dialogs and itemBuilder context in its callback.
          p='lib/features/inventory/inventory_screen.dart'
          patch(p, "    for (final c in [name, gstin, street, city, state, stateCode, pincode]) {\n      c.dispose();\n    }\n    if (ok == true) {", "    for (final c in [name, gstin, street, city, state, stateCode, pincode]) {\n      c.dispose();\n    }\n    if (!mounted) return;\n    if (ok == true) {")
          patch(p, "                                            if (mounted) {\n                                              showMessage(context, e.toString(),", "                                            if (context.mounted) {\n                                              showMessage(context, e.toString(),")
          patch(p, "      number.dispose();\n      qty.dispose();\n      notes.dispose();\n      if (ok == true) {", "      number.dispose();\n      qty.dispose();\n      notes.dispose();\n      if (!mounted) return;\n      if (ok == true) {")
          patch(p, "      number.dispose();\n      qty.dispose();\n      cost.dispose();\n      reason.dispose();\n      if (ok == true) {", "      number.dispose();\n      qty.dispose();\n      cost.dispose();\n      reason.dispose();\n      if (!mounted) return;\n      if (ok == true) {")

          # Settings callbacks use their build-context after awaits; outer dialog flows use State.mounted.
          p='lib/features/settings/settings_screen.dart'
          patch(p, "                  if (mounted) {\n                    setState(() =>\n                        _company = Map<String, dynamic>.from(data as Map));\n                    showMessage(context, 'Company profile updated.');\n                  }\n                } catch (e) {\n                  if (mounted) showMessage(context, e.toString(), error: true);", "                  if (context.mounted) {\n                    setState(() =>\n                        _company = Map<String, dynamic>.from(data as Map));\n                    showMessage(context, 'Company profile updated.');\n                  }\n                } catch (e) {\n                  if (context.mounted) showMessage(context, e.toString(), error: true);")
          patch(p, "                if (mounted) {\n                  setState(\n                      () => _settings = Map<String, dynamic>.from(data as Map));\n                  showMessage(context, 'GST integration settings updated.');\n                }\n              } catch (e) {\n                if (mounted) showMessage(context, e.toString(), error: true);", "                if (context.mounted) {\n                  setState(\n                      () => _settings = Map<String, dynamic>.from(data as Map));\n                  showMessage(context, 'GST integration settings updated.');\n                }\n              } catch (e) {\n                if (context.mounted) showMessage(context, e.toString(), error: true);")
          patch(p, "    email.dispose();\n    if (sent == true) {", "    email.dispose();\n    if (!mounted) return;\n    if (sent == true) {")
          patch(p, "    if (picked == null || picked.files.isEmpty) return;\n    final confirmed = await showDialog<bool>(", "    if (picked == null || picked.files.isEmpty) return;\n    if (!mounted) return;\n    final confirmed = await showDialog<bool>(")
          patch(p, "                      if (mounted) {\n                        current.clear();\n                        next.clear();\n                        showMessage(context, 'Password changed.');\n                      }\n                    } catch (e) {\n                      if (mounted) {\n                        showMessage(context, e.toString(), error: true);\n                      }", "                      if (context.mounted) {\n                        current.clear();\n                        next.clear();\n                        showMessage(context, 'Password changed.');\n                      }\n                    } catch (e) {\n                      if (context.mounted) {\n                        showMessage(context, e.toString(), error: true);\n                      }")

          # This file is deliberately the web half of a conditional download adapter.
          p='lib/core/utils/file_download_web.dart'
          s=Path(p).read_text()
          marker='// ignore_for_file: avoid_web_libraries_in_flutter\n\n'
          if marker not in s:
              Path(p).write_text(marker+s)
          PY

      - name: Format repaired source
        run: dart format lib test

      - name: Static project audit
        run: python tool/static_audit.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release web bundle
        run: flutter build web --release

      - name: Package repaired source
        if: success()
        run: zip -q repaired-source.zip lib/features/eway/eway_bills_screen.dart lib/features/financial_years/financial_years_screen.dart lib/features/inventory/inventory_screen.dart lib/features/settings/settings_screen.dart lib/core/utils/file_download_web.dart

      - name: Upload repaired source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-source
          path: repaired-source.zip
          retention-days: 1
