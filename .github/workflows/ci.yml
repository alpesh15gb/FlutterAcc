name: Flutter CI

on:
  pull_request:
  push:
    branches: [main, fix/tax-mode-consistency]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Static project audit
        run: python tool/static_audit.py

      - name: Apply safe Dart fixes
        if: github.ref_name == 'fix/tax-mode-consistency' || github.head_ref == 'fix/tax-mode-consistency'
        run: dart fix --apply

      - name: Format source
        run: dart format lib test

      - name: Commit release cleanup
        if: github.ref_name == 'fix/tax-mode-consistency' || github.head_ref == 'fix/tax-mode-consistency'
        run: |
          if git diff --quiet; then
            echo "Source already clean."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: apply Dart fixes and formatter"
            git push origin HEAD:fix/tax-mode-consistency
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release web bundle
        run: flutter build web --release
