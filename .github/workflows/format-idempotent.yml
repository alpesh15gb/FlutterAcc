name: Canonical Dart formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/tax-mode-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Canonically format all Dart source
        run: |
          dart --version
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Commit verified formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib test
          if git diff --cached --quiet; then
            echo "Dart source already canonical."
            exit 0
          fi
          git commit -m "style: canonicalize Dart release source"
          git push origin HEAD:fix/tax-mode-consistency
