name: Format release GST source

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/tax-mode-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed release source
        run: dart format lib/features/notes/notes_screen.dart lib/features/recurring/recurring_invoices_screen.dart lib/features/sales/tax_document_editor_screen.dart

      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/features/notes/notes_screen.dart \
            lib/features/recurring/recurring_invoices_screen.dart \
            lib/features/sales/tax_document_editor_screen.dart
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style: format GST release source"
          git push origin HEAD:fix/tax-mode-consistency
