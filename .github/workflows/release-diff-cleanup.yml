name: Focus release diff

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'fix/tax-mode-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore unrelated Dart formatting churn
        shell: bash
        run: |
          git fetch origin main
          while IFS= read -r file; do
            case "$file" in
              lib/data/workspace_catalog.dart|\
              lib/features/masters/products_screen.dart|\
              lib/features/notes/notes_screen.dart|\
              lib/features/recurring/recurring_invoices_screen.dart|\
              lib/features/sales/invoices_screen.dart|\
              lib/features/sales/tax_document_editor_screen.dart|\
              lib/features/workspaces/data_workspace_screen.dart|\
              test/tax_mode_contract_test.dart)
                ;;
              lib/*.dart|lib/**/*.dart|test/*.dart|test/**/*.dart)
                git checkout origin/main -- "$file"
                ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)

          git rm --ignore-unmatch \
            .github/workflows/format-idempotent.yml \
            .github/workflows/release-diff-cleanup.yml

      - name: Commit focused release tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib test .github/workflows
          if git diff --cached --quiet; then
            echo "Release diff already focused."
            exit 0
          fi
          git commit -m "chore: remove unrelated formatting churn"
          git push origin HEAD:fix/tax-mode-consistency
