name: Apply release GST fixup

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/tax-mode-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded source fixup
        shell: bash
        run: |
          if grep -q "value: 'SEZ_WITHOUT_TAX'" lib/features/sales/tax_document_editor_screen.dart \
             && grep -q "'is_gst_inclusive': _inclusive" lib/features/recurring/recurring_invoices_screen.dart; then
            echo "Release fixup already applied."
            exit 0
          fi
          python tool/release_fixup.py
          python tool/static_audit.py

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/features/sales/tax_document_editor_screen.dart \
            lib/features/recurring/recurring_invoices_screen.dart \
            lib/features/sales/invoices_screen.dart \
            lib/data/workspace_catalog.dart \
            lib/features/workspaces/data_workspace_screen.dart \
            lib/features/masters/products_screen.dart \
            test/tax_mode_contract_test.dart
          if git diff --cached --quiet; then
            echo "No release fixup changes to commit."
            exit 0
          fi
          git commit -m "fix: make GST rate semantics consistent across frontend"
          git push origin HEAD:fix/tax-mode-consistency
